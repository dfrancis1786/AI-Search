<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse</title>
<meta name="theme-color" content="#0A0B0D">
<meta name="description" content="Your markets, music and news in one place.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulse">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter+Tight:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div>
      <div class="eyebrow" id="today-date">&nbsp;</div>
      <h1 class="greeting" id="greeting">Hello.</h1>
    </div>
    <button class="icon-btn" id="open-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>

  <!-- TODAY -->
  <main class="view active" id="view-today">
    <div class="card weather" id="weather-card"><div class="skel" style="height:150px"></div></div>

    <section class="section">
      <div class="section-head"><h2 class="section-title">Markets</h2><button class="link" data-go="markets">Watchlist</button></div>
      <div class="index-strip" id="today-indices"></div>
    </section>

    <section class="section" id="today-music-sec">
      <div class="section-head"><h2 class="section-title">Listening</h2><button class="link" data-go="music">Music</button></div>
      <div id="today-music"></div>
    </section>

    <section class="section">
      <div class="section-head"><h2 class="section-title">Top stories</h2><button class="link" data-go="news">All news</button></div>
      <div id="today-news"><div class="skel" style="height:260px"></div></div>
    </section>
  </main>

  <!-- MARKETS -->
  <main class="view" id="view-markets">
    <div class="row-gap" style="justify-content:space-between">
      <div>
        <h2 class="page-title">Markets</h2>
        <div class="market-state" id="market-state"><span class="dot"></span><span>—</span></div>
      </div>
      <button class="btn ghost small" id="edit-watch">Edit</button>
    </div>

    <section class="section">
      <div class="index-strip" id="indices"></div>
    </section>

    <section class="section">
      <div class="section-head"><h2 class="section-title">Watchlist</h2><span class="src" id="quotes-updated"></span></div>
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="sym-search" placeholder="Add a stock, ETF or crypto" autocomplete="off" autocapitalize="characters" spellcheck="false">
      </div>
      <div class="list search-results hidden" id="sym-results"></div>
      <div class="list" id="watchlist" style="margin-top:12px"></div>
    </section>

    <section class="section">
      <div class="section-head"><h2 class="section-title">Market news</h2></div>
      <div class="news-list" id="markets-news"></div>
    </section>
  </main>

  <!-- MUSIC -->
  <main class="view" id="view-music">
    <h2 class="page-title">Music</h2>
    <p class="page-sub" id="music-sub">From your Spotify</p>
    <div id="music-body" style="margin-top:20px"></div>
  </main>

  <!-- NEWS -->
  <main class="view" id="view-news">
    <h2 class="page-title">News</h2>
    <p class="page-sub">Updated every few minutes</p>
    <div class="chips" id="news-chips" style="margin-top:18px"></div>
    <div id="news-body" style="margin-top:18px"></div>
  </main>

  <p class="foot" id="foot">Market data via Yahoo Finance, delayed up to 15 min. Not financial advice.<br>Weather by Open-Meteo.</p>
</div>

<nav class="nav" id="nav">
  <button data-go="today" class="on" aria-label="Today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button data-go="markets" aria-label="Markets">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg>Markets</button>
  <button data-go="music" aria-label="Music">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Music</button>
  <button data-go="news" aria-label="News">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M8 9h5M8 13h5"/></svg>News</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-grip"></div><div class="sheet-body" id="sheet-body"></div></div>
<div class="toast" id="toast"></div>

<script src="app.js?v=1"></script>
</body>
</html>
